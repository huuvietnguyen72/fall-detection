<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Arial, Helvetica, sans-serif">
  <title>Máy trạng thái Decision Fusion</title>
  <style>
    .title { font-size: 30px; font-weight: 700; fill: #0b0b0b; }
    .sub { font-size: 17px; fill: #52514e; }
    .st { font-size: 24px; font-weight: 700; fill: #0b0b0b; }
    .sts { font-size: 14px; fill: #52514e; }
    .lbl { font-size: 15px; fill: #0b0b0b; }
    .lbl2 { font-size: 14px; fill: #52514e; }
    .arr { stroke: #52514e; stroke-width: 2.4; fill: none; marker-end: url(#a); }
    .arro { stroke: #eb6834; stroke-width: 2.6; fill: none; marker-end: url(#ao); }
    .arrg { stroke: #1baf7a; stroke-width: 2.4; fill: none; marker-end: url(#ag); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker>
  </defs>
  <rect width="1500" height="900" fill="#fcfcfb"/>
  <text x="40" y="50" class="title">Máy trạng thái hợp nhất quyết định (server/fusion.py)</text>
  <text x="40" y="78" class="sub">Đai mở sự cố, camera xác nhận hoặc bác bỏ; người dùng luôn có quyền hủy. Mọi ngưỡng cấu hình trong .env</text>

  <!-- States -->
  <rect x="80" y="330" width="250" height="130" rx="65" fill="#ffffff" stroke="#1baf7a" stroke-width="3"/>
  <text x="205" y="388" class="st" text-anchor="middle">IDLE</text>
  <text x="205" y="414" class="sts" text-anchor="middle">giám sát bình thường</text>

  <rect x="620" y="330" width="260" height="130" rx="65" fill="#ffffff" stroke="#eda100" stroke-width="3"/>
  <text x="750" y="388" class="st" text-anchor="middle">COUNTDOWN</text>
  <text x="750" y="414" class="sts" text-anchor="middle">15 s · còi bíp · cho phép hủy</text>

  <rect x="1170" y="330" width="250" height="130" rx="65" fill="#ffffff" stroke="#d03b3b" stroke-width="3"/>
  <text x="1295" y="388" class="st" text-anchor="middle">SOS</text>
  <text x="1295" y="414" class="sts" text-anchor="middle">Telegram + ảnh · còi liên tục</text>

  <!-- IDLE -> COUNTDOWN -->
  <path d="M330,370 L615,370" class="arro"/>
  <text x="350" y="340" class="lbl">Đai báo va chạm</text>
  <text x="350" y="360" class="lbl2">(AI + tư thế, điểm ≥ 0,5)</text>

  <!-- COUNTDOWN -> SOS -->
  <path d="M880,370 L1165,370" class="arro"/>
  <text x="898" y="320" class="lbl">Hết 15 s và camera thấy NẰM</text>
  <text x="898" y="340" class="lbl2">(SOS — lý do: fusion)</text>
  <text x="898" y="360" class="lbl2">hoặc không thấy người + policy=sos</text>

  <!-- COUNTDOWN -> IDLE (bottom) -->
  <path d="M640,450 C560,560 400,560 300,455" class="arrg"/>
  <text x="380" y="585" class="lbl">Quay về IDLE khi:</text>
  <text x="380" y="607" class="lbl2">• người dùng bấm nút → CANCELLED</text>
  <text x="380" y="627" class="lbl2">• camera ĐỨNG liên tục ≥ 3 s → IGNORED (báo nhầm, vd. rơi đai)</text>
  <text x="380" y="647" class="lbl2">• hết 15 s, camera thấy ngồi / cúi → IGNORED</text>
  <text x="380" y="667" class="lbl2">• hết 15 s, không thấy người → WARN (cảnh báo nhẹ, policy=warn)</text>

  <!-- IDLE -> SOS (top arc) -->
  <path d="M205,325 C300,150 1200,150 1290,325" class="arro" stroke-dasharray="9 6"/>
  <text x="750" y="190" class="lbl" text-anchor="middle">Dự phòng khi mất đai: đai offline &gt; 10 s và camera thấy NẰM liên tục ≥ 20 s</text>
  <text x="750" y="212" class="lbl2" text-anchor="middle">(SOS — lý do: vision_only)</text>

  <!-- SOS -> IDLE (bottom long arc) -->
  <path d="M1295,465 C1250,890 300,890 190,465" class="arr"/>
  <text x="760" y="722" class="lbl">Bấm nút trên đai hoặc Reset trên dashboard</text>
  <text x="760" y="742" class="lbl2">→ RESOLVED, gửi Telegram "đã an toàn"</text>

  <!-- Inputs legend -->
  <text x="40" y="870" class="lbl2">Đầu vào: event của đai (impact / cancel), status 1 Hz (đai còn online), posture của camera (cũ hơn 3 s = mất tín hiệu). Vòng tick 10 Hz.</text>
</svg>
